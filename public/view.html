<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Api - View</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="topbar"></div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar"></div>

<div id="main-content">
  <div class="page-header">
    <h1>View API</h1>
    <p>Load and inspect API endpoint data</p>
  </div>

  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Load API Data
    </div>
    <div class="form-group">
      <label>API ID</label>
      <input type="text" id="view-apiId" placeholder="e.g. abc1234567">
    </div>
    <div class="form-group">
      <label>API Name</label>
      <input type="text" id="view-apiName" placeholder="e.g. my-api">
    </div>
    <button class="btn btn-primary" id="btn-load" style="width:100%;padding:12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Load
    </button>
  </div>

  <div class="card" style="margin-top:20px;display:none;" id="output-card">
    <div class="card-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      Result
      <button class="btn btn-ghost btn-sm" id="btn-copy-output" style="margin-left:auto;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy
      </button>
    </div>
    <pre class="view-json" id="view-output" style="display:none;"></pre>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script>
(function() {
  const loadBtn = document.getElementById('btn-load');
  const outputEl = document.getElementById('view-output');
  const outputCard = document.getElementById('output-card');
  const copyBtn = document.getElementById('btn-copy-output');

  if (loadBtn) {
    loadBtn.addEventListener('click', async () => {
      const apiId = document.getElementById('view-apiId').value.trim();
      const apiName = document.getElementById('view-apiName').value.trim();
      if (!apiId || !apiName) { toast('Please enter both API ID and API Name', 'error'); return; }
      outputCard.style.display = 'block';
      outputEl.style.display = 'block';
      outputEl.textContent = 'Loading...';
      try {
        const r = await fetch('/api/v4/' + apiId + '/' + apiName);
        const data = await r.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        outputEl.textContent = 'Error: ' + String(e);
      }
    });
  }
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      if (outputEl && outputEl.textContent) copyText(outputEl.textContent);
    });
  }
  document.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && loadBtn) loadBtn.click(); });
  });
})();
</script>
</body>
</html>
