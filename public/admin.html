<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Api - Admin</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="topbar"></div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar"></div>

<div id="main-content">
  <div class="page-header">
    <h1>Admin Panel</h1>
    <p>Manage all APIs across all users</p>
  </div>

  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      All APIs
    </div>
    <div id="api-list"></div>
    <div id="pagination" class="pagination"></div>
  </div>
</div>

<div class="dialog-overlay" id="edit-dialog">
  <div class="dialog">
    <div class="dialog-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit API
    </div>
    <div id="edit-form-fields"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="btn-edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-edit-save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save
      </button>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="delete-dialog">
  <div class="dialog">
    <div class="dialog-title" style="color:#ff6666;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
      Delete API
    </div>
    <p style="color:var(--text-muted);font-size:0.9rem;">Are you sure? This will permanently delete the API and all its data.</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="btn-delete-cancel">Cancel</button>
      <button class="btn btn-danger" id="btn-delete-confirm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
        Delete
      </button>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="reset-dialog">
  <div class="dialog">
    <div class="dialog-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      Reset API Data
    </div>
    <p style="color:var(--text-muted);font-size:0.9rem;">This will clear all entries from this API endpoint.</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="btn-reset-cancel">Cancel</button>
      <button class="btn btn-danger" id="btn-reset-confirm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        Reset
      </button>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
