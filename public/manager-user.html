<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Api - User Manager</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="topbar"></div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar"></div>

<div id="main-content">
  <div class="page-header">
    <h1>User Manager</h1>
    <p>Manage user accounts and permissions</p>
  </div>

  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      All Users
    </div>
    <div id="user-list"></div>
    <div id="pagination" class="pagination"></div>
  </div>
</div>

<div class="dialog-overlay" id="confirm-dialog">
  <div class="dialog">
    <div class="dialog-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Confirm Action
    </div>
    <p id="confirm-msg" style="color:var(--text-muted);font-size:0.9rem;">Are you sure?</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="btn-confirm-no">Cancel</button>
      <button class="btn btn-primary" id="btn-confirm-yes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Confirm
      </button>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/manager-user.js"></script>
</body>
</html>
