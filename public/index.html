<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Api - Home</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="topbar"></div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar"></div>

<div id="main-content">
  <div class="page-header">
    <h1>Create API</h1>
    <p>Configure and deploy a new API endpoint in seconds</p>
  </div>

  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      API Configuration
    </div>
    <div id="create-form-fields"></div>
    <button class="btn btn-primary" id="btn-create-api" style="width:100%;margin-top:8px;padding:13px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Create API
    </button>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      System Log
    </div>
    <div class="log-console" id="log-console"></div>
  </div>

  <div class="result-box" id="result-box"></div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
