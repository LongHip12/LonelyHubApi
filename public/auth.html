<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Api - Auth</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="topbar"></div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar"></div>

<div id="main-content">
  <div class="auth-page">
    <div class="auth-card card">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:1.4rem;font-weight:800;color:var(--primary);margin-bottom:4px;">Lonely Api</div>
        <div style="color:var(--text-muted);font-size:0.88rem;">Sign in to manage your APIs</div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab" id="tab-login">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Login
        </button>
        <button class="auth-tab" id="tab-register">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Register
        </button>
      </div>

      <div id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="btn-login" style="width:100%;margin-top:6px;padding:12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Login
        </button>
        <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:var(--text-muted);">
          No account?
          <a href="/auth?method=register" id="go-register" style="color:var(--primary);">Register now</a>
        </p>
      </div>

      <div id="register-form" style="display:none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Choose a password" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="btn-register" style="width:100%;margin-top:6px;padding:12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Register
        </button>
        <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:var(--text-muted);">
          Already have an account?
          <a href="/auth?method=login" id="go-login" style="color:var(--primary);">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
