<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Hub — Login</title>
<link rel="stylesheet" href="/api/static/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">
    <img src="https://i.imgur.com/xY7M2iE.jpeg" alt="Lonely Hub">
    <h1>Lonely Hub</h1>
    <p>Admin Panel</p>
  </div>
  <div class="tab-row">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
  </div>
  <div id="form-login">
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="Username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    </div>
    <div id="login-error" class="error-msg"></div>
    <button class="btn-primary full" onclick="doLogin()">Login</button>
  </div>
  <div id="form-register" style="display:none">
    <div class="field">
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="Username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Password" autocomplete="new-password">
    </div>
    <div id="reg-error" class="error-msg"></div>
    <button class="btn-primary full" onclick="doRegister()">Register</button>
  </div>
</div>
<script>
function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  if (!username || !password) { err.textContent = 'Please fill all fields'; return; }
  const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error || 'Login failed'; return; }
  window.location.href = '/admin';
}

async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const err = document.getElementById('reg-error');
  err.textContent = '';
  if (!username || !password) { err.textContent = 'Please fill all fields'; return; }
  const r = await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error || 'Register failed'; return; }
  window.location.href = '/admin';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const tab = document.getElementById('form-login').style.display !== 'none' ? 'login' : 'register';
    tab === 'login' ? doLogin() : doRegister();
  }
});
</script>
</body>
</html>
